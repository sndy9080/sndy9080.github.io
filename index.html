<style>

*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:var(--sig)}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--sig);outline-offset:3px}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}

.hero{padding:64px 0 28px}
.hero h1{font-size:clamp(40px,8vw,76px);font-weight:800;letter-spacing:-.02em}
.sub{font-size:20px;color:var(--mute);margin:10px 0 0;max-width:34em}
.pitch{font-size:22px;max-width:30em;margin:26px 0 18px;min-height:3.3em}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}

.roles button[aria-pressed=true]{background:var(--sig);border-color:var(--sig);color:#fff}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.cta a{padding:10px 20px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:600}
.cta a.main{background:var(--ink);color:var(--bg)}
.pipe{margin:38px 0 0;color:var(--mute);font-size:13px}
.pipe svg{width:100%;height:auto;display:block}
.proof{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:34px 0 0}
.proof div{background:var(--surface);padding:16px 18px}
.proof b{display:block;font:800 26px "Bricolage Grotesque",sans-serif;color:var(--sig)}
.proof span{font-size:14px;color:var(--mute)}
section{padding:54px 0 0}
h2{font-size:32px;margin-bottom:6px}.lead{color:var(--mute);margin:0 0 24px}
.proj{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sig);padding:18px 20px;margin-bottom:14px}
.proj[data-t=iot]{border-left-color:var(--amb)}.proj[data-t=it]{border-left-color:var(--mute)}
.proj h3{font-size:21px}.role{font-size:14px;color:var(--mute);margin:2px 0 8px}
.proj p{margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.tags li{font-size:13px;background:var(--bg);border:1px solid var(--line);padding:1px 9px}
.proj .lk{font-weight:600}.badge{display:inline-block;background:var(--ambbg);color:var(--amb);font-size:13px;font-weight:600;padding:0 8px;margin-left:8px;vertical-align:2px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
.skills h3{font-size:18px;margin-bottom:8px}.skills ul{margin:0;padding-left:18px;color:var(--mute)}
.exp div{border-top:1px solid var(--line);padding:14px 0}.exp b{display:block}.exp span{color:var(--mute);font-size:15px}
footer{margin-top:64px;border-top:1px solid var(--line);padding:30px 0 50px;color:var(--mute);font-size:15px}
.contact a{margin-right:18px;font-weight:600}
@media(max-width:560px){header nav{display:none}.pitch{min-height:5.5em}}
</style>
</head>
