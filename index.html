 $("#cta").innerHTML=`<a href="#projects">${t.nProj}</a>`+(CFG.cv?A(CFG.cv,"",t.cv):"")+[[CFG.github,"gh","GitHub"],[CFG.linkedin,"in","LinkedIn"],[CFG.whatsapp,"wa","WhatsApp"]].filter(x=>x[0]).map(x=>A(...x)).join("");
 $("#proof").innerHTML=t.proof.map(p=>`<div><small>${p[2]}</small><b>${p[0]}</b><span>${p[1]}</span></div>`).join("");
 const card=(p,i)=>{const b="assets/projects/"+p.img.replace(/\.\w+$/,"");return `<article class="proj${i===0?" feat":""}" data-t="${p.t}"><div class="shot" data-l="${p.s}"><img src="${b}.png" data-b="${b}" data-k="1" alt="" loading="lazy" onerror="nx(this)"></div><div class="body"><h3>${p.n}</h3><p class="role">${p.r}</p><p>${p.d[lang]}</p><ul class="tags">${p.g.map(x=>`<li>${x}</li>`).join("")}</ul>${p.repo?`<a class="lk" href="${R}${p.repo}" target="_blank" rel="noopener">${t.repo}</a>`:""}</div></article>`};
 $("#listD").innerHTML=PD.map(card).join("");$("#listI").innerHTML=PI.map(card).join("");
 $("#secData").style.order=role==="data"?0:1;$("#secIt").style.order=role==="it"?0:1;
 $("#sk").innerHTML=SK.map((g,i)=>`<div><h3>${t.sk[i]}</h3><ul>${g.map(x=>`<li>${x[1]?`<img src="https://cdn.simpleicons.org/${x[1]}/C9CEF0" alt="" loading="lazy" onerror="this.remove()">`:""}${x[0]}</li>`).join("")}</ul></div>`).join("");
 const row=(o,ph)=>`<article class="row${ph?"":" hv"}"><i class="lg" data-l="${o.s}"><img src="assets/logos/${o.l}.png" data-b="assets/logos/${o.l}" data-k="1" alt="" onerror="nx(this)"></i><span class="rt"><b>${L(o.t)}</b><span class="o">${o.o}</span><span class="m">${L(o.m)}</span><span class="d">${L(o.d)}</span>${ph?"":`<span class="stk">${ims(o.l)}</span>`}</span>${ph?`<img class="ph" src="assets/photos/student.png" alt="" onerror="this.remove()">`:""}</article>`;
 $("#ex").innerHTML=EX.map(o=>row(o)).join("");$("#og").innerHTML=OG.map(o=>row(o)).join("");$("#ed").innerHTML=row(ED,1);
 $("#rc").innerHTML=RC.map(r=>`<a class="rec" href="${r[0]}" target="_blank" rel="noopener"><i class="lg" data-l="${r[1]}"></i><span class="rt"><b>${L(r[2])}</b><span class="d">${L(r[3])}</span><span class="m">${L(r[4])}</span></span></a>`).join("");
 $("#cx").innerHTML=CERTS.map((c,i)=>c.u?`<a data-c="${i}" href="${c.u}" target="_blank" rel="noopener">${c.n}</a>`:`<span data-c="${i}" tabindex="0">${c.n}</span>`).join("");
 $("#cx").querySelectorAll("[data-c]").forEach(e=>{e.onpointerenter=e.onfocus=()=>sh(e);e.onpointerleave=e.onblur=ht});
 if(!$("#abk").children.length)$("#abk").innerHTML=ims("about");
 document.querySelectorAll(".hv").forEach(hv);document.querySelectorAll(".stk").forEach(rf);
 $("#ct").innerHTML=[[CFG.email,"mail","Email"],[CFG.linkedin,"in","LinkedIn"],[CFG.whatsapp,"wa","WhatsApp"],[CFG.github,"gh","GitHub"]].filter(x=>x[0]).map(x=>A(...x)).join("");
 $("#arch").href=CFG.archive;
 document.querySelectorAll(".proj").forEach((e,i)=>e.style.setProperty("--d",i*60+"ms"));
 if(!RM)$("#pitch").animate([{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{duration:320});
}
document.addEventListener("click",e=>{
 const l=e.target.closest("[data-lang]"),r=e.target.closest("[data-r]");
 if(l){lang=l.dataset.lang;try{localStorage.setItem("lang",lang)}catch(x){}render()}
 if(r){role=r.dataset.r;history.replaceState(null,"",role==="all"?location.pathname:"#"+role);render()}
});
const h=location.hash.slice(1);if(["data","it"].includes(h))role=h;
if(matchMedia("(prefers-reduced-motion:reduce)").matches)document.querySelector("animateMotion").remove();
document.addEventListener("pointermove",e=>{const c=e.target.closest(".proj");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--x",e.clientX-r.left+"px");c.style.setProperty("--y",e.clientY-r.top+"px")}});
render();
document.documentElement.classList.add("js");
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
setTimeout(()=>document.querySelectorAll(".rv").forEach(e=>e.classList.add("in")),1800);
</script>
</body>
</html>
